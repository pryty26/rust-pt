[workspace]
members = [
    "rust_pt/pt_err",
    "rust_pt/pt_tracing",
    "rust_pt/pt_config",
    "rust_pt/pt_core",
    "transports/reality-pt",
]
resolver = "2"

[workspace.package]
version     = "0.0.0-alpha.2"
edition     = "2024"
license     = "Apache-2.0"
repository  = "https://gitlab.torproject.org/pryty26/rust-pt"
readme      = "README.md"
keywords    = ["tor", "proxy", "pluggable transport"]
categories  = ["network-programming"]

[workspace.metadata]
name = "rust-pt"

[workspace.dependencies]
# Internal crates
pt_err     = { version = "0.0.0-alpha.2" }
pt_core    = { version = "0.0.0-alpha.2" }
pt_config  = { version = "0.0.0-alpha.2" }
pt_tracing = { version = "0.0.0-alpha.2" }

# Core utilities
anyhow          = "1.0.104"
thiserror       = "2.0.19"
serde           = { version = "1.0.229", features = ["derive"] }
serde_json      = "1.0.151"
once_cell       = "1.21.4"
dotenvy         = "0.15.7"

# Async runtime
tokio           = { version = "1.53.1", features = ["full"] }

# Tracing & logging
tracing         = "0.1.44"
tracing-subscriber = "0.3.23"

# Data formats
toml            = "1.1.5"
zip             = "8.6.0"
derive-deftly   = "1.11.5"
envy            = "0.4.2"

# Networking
url             = { version = "2.5.8", features = ["serde"] }

# Crypto
hmac            = "0.13.0"
sha2            = "0.11.0"
getrandom       = "0.4.3"