[workspace]
members = [
    "rust_pt/pt_err",
    "rust_pt/pt_tracing",
    "rust_pt/pt_config",
    "rust_pt/pt_core",
    "transports/reality-pt",
    ]
resolver = "2"
[workspace.package]
name = "rust-pt"
version = "0.0.0-alpha.1"
edition = "2024"
license = "Apache-2.0"   
repository = "https://gitlab.torproject.org/pryty26/rust-pt"

[workspace.dependencies]
pt_err = { version = "0.0.0-alpha.1" }
pt_core = { version = "0.0.0-alpha.1" }
pt_config = { version = "0.0.0-alpha.1" }
pt_tracing = { version = "0.0.0-alpha.1" }

anyhow = "1.0.104"
zip = "8.6.0"
toml = "1.1.5"
derive-deftly = "1.11.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
once_cell = "1.21.4"
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = { version = "2.5.8", features = ["serde"] }
envy = "0.4.2"
tokio = { version = "1.53.1", features = ["full"]}
hmac = "0.13.0"
sha2 = "0.11.0"
getrandom = "0.4.3"