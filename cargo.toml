[workspace]
members = ["transports/*", "rust_pt/*"]
resolver = "2"
[workspace.package]
name = "rust-pt"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
zip = "8.6.0"
derive-deftly = "1.11.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.1.4", features = ["serde"] }
thiserror = "2.0.19"
once_cell = "1.21.4"
dotenv = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = { version = "2.5.8", features = ["serde"] }